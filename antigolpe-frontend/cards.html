<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AntiGolpe - Meus Cartões</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <div class="cards-page-container">
            <h2>Meus Cartões</h2>
            <div id="cards-grid" class="cards-grid">
                <p>Carregando cartões...</p>
                </div>
            <div class="action-buttons">
                <button id="add-new-card-btn" class="btn">Adicionar novo cartão</button>
            </div>

            <div id="add-card-form-container" class="form-container" style="display:none;">
                <h3>Adicionar Novo Cartão</h3>
                <div class="form-group">
                    <label for="new-card-bandeira">Bandeira:</label>
                    <input type="text" id="new-card-bandeira" placeholder="Ex: VISA, MASTERCARD">
                </div>
                <div class="form-group">
                    <label for="new-card-numero">Número do Cartão:</label>
                    <input type="text" id="new-card-numero" placeholder="XXXX XXXX XXXX XXXX">
                </div>
                <div class="form-group">
                    <label for="new-card-nomeTitular">Nome do Titular:</label>
                    <input type="text" id="new-card-nomeTitular" placeholder="Nome Impresso no Cartão">
                </div>
                <div class="form-group">
                    <label for="new-card-dataValidade">Data de Validade (MM/AA):</label>
                    <input type="text" id="new-card-dataValidade" placeholder="MM/AA" maxlength="5">
                </div>
                <div id="add-card-error-message" class="error-message" style="display:none;"></div>
                <button id="save-new-card-btn" class="btn">Salvar Cartão</button>
                <button id="cancel-add-card-btn" class="btn secondary-btn">Cancelar</button>
            </div>
        </div>
    </main>

    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/common.js"></script>
    <script type="module" src="js/cards.js"></script>
</body>
</html>
