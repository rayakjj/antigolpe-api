<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AntiGolpe - Entrar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="img/shield-icon.png" alt="Logo AntiGolpe"> <h1>AntiGolpe</h1>
        </div>
        <h2>Entre na sua conta</h2>
        <div id="error-message" class="error-message" style="display:none;"></div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="seu.email@exemplo.com">
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="********">
        </div>
        <button id="login-btn" class="btn">Entrar</button>
        <a href="register.html" class="link">Não tem sua conta? Cadastre-se aqui</a>
    </div>

    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/login.js"></script>
</body>
</html>
